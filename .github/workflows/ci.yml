name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Run tests
        run: node tests/test.mjs

  # Checks the workflow expressions and job graph, and shells out to shellcheck
  # for every `run:` block.
  actionlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.62.3

      - name: Lint workflows
        run: |
          set -euo pipefail
          # actionlint silently skips its shell checks when shellcheck is
          # absent, which would quietly reduce this job to expression linting
          # if the runner image ever drops it.
          command -v shellcheck >/dev/null || {
            echo "::error::shellcheck is not on the runner; actionlint would skip every run: block"
            exit 1
          }
          actionlint -no-color

  # Static audit of the workflows themselves: template injection, credential
  # persistence, permission scope, spoofable bot conditions. This repo ships an
  # action other repos consume, so its own workflows are worth auditing.
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF to code scanning (free on public repos)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          # renovate: datasource=github-releases depName=zizmorcore/zizmor
          version: "1.29.0"

  # The only required status check; see the repo ruleset.
  gate:
    name: CI Gate
    needs: [test, actionlint, zizmor]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Aggregate results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Results: ${RESULTS}"
          if [ -z "${RESULTS// /}" ]; then
            echo "::error::No job results to aggregate (empty needs) — failing closed."
            exit 1
          fi
          for r in ${RESULTS}; do
            case "${r}" in
              success|skipped) ;;
              *) echo "::error::A required job concluded with: ${r}"; exit 1 ;;
            esac
          done
