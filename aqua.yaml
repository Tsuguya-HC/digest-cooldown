---
# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/aqua-yaml.json
#
# CLI versions for the lint workflow. aqua records a SHA256 for each binary in
# aqua-checksums.json and refuses to install anything that does not match, so
# nothing in CI is fetched from a floating `releases/latest` URL.
checksum:
  enabled: true
  # Fail rather than fall back to "just download it" when a checksum is missing.
  require_checksum: true
  # CI and the workstation are both linux/amd64; recording other platforms
  # would only pad the lock file.
  supported_envs:
    - linux/amd64

registries:
  - type: standard
    ref: v4.552.0 # renovate: depName=aquaproj/aqua-registry

packages:
  - name: rhysd/actionlint@v1.7.12
